<!doctype html><meta charset="utf-8">
<!-- Hero render of an asteroid shape model (mesh.json from export_mesh.py): raking key light with
     shadows so the concavities read, a faint cool rim light, transparent background.
     URL parameters (degrees): az, el = camera direction; laz, lel = key light direction relative
     to the camera; w, h = pixels; mesh = the exported file (default mesh.json). Driven by render_hero.sh. -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const q = new URL(location.href).searchParams, num = (k, d) => +(q.get(k) ?? d);
const W = num('w', 900), H = num('h', 700), rad = Math.PI / 180;
const m = await fetch(q.get('mesh') || 'mesh.json').then(r => r.json());

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(m.v.map(x => x * m.s), 3));
geo.setIndex(m.f);
geo.computeVertexNormals();
geo.computeBoundingSphere();
const c = geo.boundingSphere.center, R = geo.boundingSphere.radius;
geo.translate(-c.x, -c.y, -c.z);

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const rock = new THREE.MeshStandardMaterial({color: 0x9a948c, roughness: 0.95, metalness: 0});
const body = new THREE.Mesh(geo, rock);
body.castShadow = body.receiveShadow = true;
scene.add(body);

// spin axis (z in the model frame) points up in the picture
const cam = new THREE.PerspectiveCamera(24, W / H, R * 0.1, R * 20);
const dir = (az, el) => new THREE.Vector3(Math.cos(el * rad) * Math.cos(az * rad), Math.cos(el * rad) * Math.sin(az * rad), Math.sin(el * rad));
const az = num('az', 30), el = num('el', 15);
cam.up.set(0, 0, 1);
cam.position.copy(dir(az, el).multiplyScalar(R * 5.2));
cam.lookAt(0, 0, 0);

// key: low and from the side, so it rakes across the surface
const key = new THREE.DirectionalLight(0xfff1e0, num('ki', 3.2));
key.position.copy(dir(az + num('laz', 100), num('lel', 18)).multiplyScalar(R * 6));
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left: -R * 1.3, right: R * 1.3, top: R * 1.3, bottom: -R * 1.3, near: R, far: R * 12});
key.shadow.bias = -0.0005;
key.shadow.normalBias = R * 0.01;
key.shadow.radius = 3;
scene.add(key);
// rim: cool, from behind and opposite the key, to lift the dark limb off the background
const rim = new THREE.DirectionalLight(0x9ab8ff, num('ri', 0.9));
rim.position.copy(dir(az + 180 - num('laz', 100) * 0.6, 25).multiplyScalar(R * 6));
scene.add(rim);
scene.add(new THREE.AmbientLight(0x404858, num('ai', 0.25)));

renderer.render(scene, cam);
document.title = 'done';
</script>
